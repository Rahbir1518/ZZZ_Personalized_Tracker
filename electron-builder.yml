appId: gg.local.zzz-team-tracker
productName: ZZZ Team Tracker
copyright: MIT licensed. Not affiliated with HoYoverse or Prydwen.

directories:
  buildResources: build
  output: release

files:
  - out/**
  - package.json
  - '!**/*.map'

# The PyInstaller sidecar binary is produced by scripts/build-sidecar.ps1 into
# resources/sidecar/ and shipped unpacked so it can be spawned as a process.
extraResources:
  - from: resources/sidecar
    to: sidecar
    filter: ['**/*']

asar: true
asarUnpack:
  - resources/sidecar/**

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  # No spaces: GitHub rewrites spaces in release asset names, which would
  # stop the updater from finding the installer latest.yml points at.
  artifactName: ZZZ-Team-Tracker-${version}-setup.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  deleteAppDataOnUninstall: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico

# Where Settings -> "Check for updates" looks. `npm run dist` still never
# uploads anything (--publish never); it just writes latest.yml next to the
# installer, and both (plus the .blockmap) get attached to the GitHub release
# by hand.
publish:
  provider: github
  owner: Rahbir1518
  repo: ZZZ_Personalized_Tracker
  releaseType: release
