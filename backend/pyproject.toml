[project]
name = "zzz-sidecar"
version = "0.1.0"
description = "Local FastAPI sidecar for ZZZ Team Tracker."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
